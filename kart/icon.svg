<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#d81f2a"/>
  <!-- pole -->
  <rect x="112" y="92" width="26" height="340" rx="13" fill="#ffffff"/>
  <!-- checkered flag, 5 x 4 squares with a gentle wave -->
  <defs>
    <pattern id="c" width="64" height="64" patternUnits="userSpaceOnUse" x="138" y="104">
      <rect width="64" height="64" fill="#ffffff"/>
      <rect width="32" height="32" fill="#14161d"/>
      <rect x="32" y="32" width="32" height="32" fill="#14161d"/>
    </pattern>
    <clipPath id="wave">
      <path d="M138 104 C 210 76, 300 132, 400 104 L 400 264 C 300 292, 210 236, 138 264 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#wave)">
    <rect x="138" y="70" width="270" height="230" fill="url(#c)"/>
  </g>
  <path d="M138 104 C 210 76, 300 132, 400 104 L 400 264 C 300 292, 210 236, 138 264 Z" fill="none" stroke="#14161d" stroke-width="8"/>
</svg>
