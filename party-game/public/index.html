<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Party Game</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="theme-picker">
    <select id="themeSelect" aria-label="Color theme">
      <option value="default">Default</option>
      <option value="blue">Blue</option>
      <option value="gold">Gold</option>
      <option value="silver">Silver</option>
      <option value="dark">Dark</option>
      <option value="green">Green</option>
      <option value="orange">Orange</option>
    </select>
  </div>
  <div class="wrap" id="app">
    <div class="title">🎤 Song Party</div>
    <div class="spinner"></div>
    <div class="muted center">Connecting...</div>
  </div>
  <footer class="hint">Stay on this page - it updates automatically as the game moves along.</footer>

  <script src="js/shared.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
