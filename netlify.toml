[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/simulation.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/simulation.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/simulation.html"
  [headers.values]
    Cache-Control = "no-cache"
